
server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 128
  servlet:
    context-path: /api/enterprise/v1  
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

spring:
  application:
    name: Enterprise
  flyway:
      enabled: false

  security:
    enabled: false
    
  datasource:
    
    url:  ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/entreprisedb}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true


  sql:
    init:
      mode: always
  
jwt:
  key: ${JWT_KEY}
  expiration: 900000




management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always



info:
  app:
    name:Doc Entrerprise
    description:Application de Gestion Entreprise de Reparation de Telephones
    version:1.0.0
